# kube-prometheus-values.yaml
grafana:
  enabled: true
  
  # Set custom login credentials
  adminUser: "admin"
  adminPassword: "unikum123"

  # Automatically import dashboard 13659
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      blackbox-exporter-http-prober:
        gnetId: 13659
        revision: 1
        datasource: Prometheus

prometheus:
  prometheusSpec:
    # Explicitly ensure Prometheus scans for Probe resources across namespaces
    probeSelectorNilUsesHelmValues: false
    probeSelector:
      matchLabels:
        release: kube-prometheus-stack

# Create the specific target probe directly within the chart deployment
additionalPrometheusRulesMap: {}

#Google probe.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: google-blackbox-probe
  namespace: monitoring
  labels:
    # Ensure this matches the release label your Prometheus uses to discover Probes
    release: kube-prometheus-stack 
spec:
  # The module configured in your Blackbox Exporter values
  module: http_2xx 
  
  # Configuration pointing Prometheus to your Blackbox Exporter service
  prober:
    url: k-prom-black-prometheus-blackbox-exporter:9115
    path: /probe
    
  # The actual endpoint(s) you want to probe
  targets:
    staticConfig:
      static:
        - https://google.com
      labels:
        instance: google.com

# blackbox-values.yaml
secretConfig: false

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: []  # Defaults to 2xx
        method: GET
        follow_redirects: true
        fail_if_ssl: false
        fail_if_not_ssl: false

