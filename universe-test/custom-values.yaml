# ================= Grafana

grafana:
  fullnameOverride: grafana
  adminUser: ""
  adminPassword: ""

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-server
          isDefault: true 

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Dashboard 13659 "Blackbox Exporter (HTTP prober)", bundled in dashboards/
  dashboardsConfigMaps:
    default: blackbox-dashboard

  grafana.ini:
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/blackbox-exporter.json  

  service:
    type: ClusterIP
    port: 80 

# ================ Prometheus         

prometheus:
  fullnameOverride: prometheus
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus-server
    global:
      scrape_interval: 30s
  extraScrapeConfigs: |
    - job_name: blackbox-http
      metrics_path: /probe
      params:
        module: [http_2xx]
      static_configs:
        - targets:
            - https://sh.infinityfree.io
            - https://google.com
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter:9115

# ======================= BlackBox

prometheus-blackbox-exporter:
  fullnameOverride: blackbox-exporter
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          follow_redirects: true
          preferred_ip_protocol: ip4
